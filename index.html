<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A production-oriented React, TypeScript, Vite and Tailwind CSS starter template."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>React TypeScript Starter</title>
    <script>
      // Apply the saved or system theme before first paint to avoid a flash of the wrong theme.
      // Keep the storage key in sync with THEME_STORAGE_KEY in src/features/theme/theme-storage.ts.
      (function () {
        try {
          var stored = localStorage.getItem('starter-theme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (_) {
          /* Storage can be unavailable (for example in some private browsing modes). */
        }
      })();
    </script>
  </head>
  <body>
    <noscript>This application requires JavaScript to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
